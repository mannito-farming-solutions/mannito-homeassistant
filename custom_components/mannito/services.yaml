open_valve:
  target:
    entity:
      integration: mannito
      domain: valve
  fields:
    duration:
      required: true
      default: 10
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: s
          mode: slider

run_valves:
  fields:
    area:
      required: true
      selector:
        device:
          filter:
            integration: mannito
    seconds:
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: s
          mode: box
    ml_per_pot:
      selector:
        number:
          min: 1
          max: 1000
          unit_of_measurement: ml
          mode: box

grow_cycle_action:
  fields:
    area:
      required: true
      selector:
        device:
          filter:
            integration: mannito
    action:
      required: true
      selector:
        select:
          translation_key: grow_cycle_action
          options:
            - confirm_phase
            - next_phase_now
            - postpone
            - set_lights_on
            - set_co2
    days:
      selector:
        number:
          min: 1
          max: 14
          mode: box
    lights_on:
      selector:
        time:
    use_co2:
      selector:
        boolean:

record_measurement:
  fields:
    target:
      required: true
      selector:
        device:
          filter:
            integration: mannito
    measurement:
      required: true
      default: height
      selector:
        select:
          translation_key: measurement
          options:
            - height
            - stem_thickness
            - leaf_size
            - plant_weight
            - optic
            - color
    value:
      required: true
      selector:
        number:
          min: 0
          max: 100000
          step: 0.1
          mode: box
    note:
      selector:
        text:
          multiline: true

record_note:
  fields:
    target:
      required: true
      selector:
        device:
          filter:
            integration: mannito
    condition:
      required: true
      default: acceptable
      selector:
        select:
          translation_key: condition
          options:
            - perfect
            - acceptable
            - warning
            - total_fail
    note:
      selector:
        text:
          multiline: true
    problem:
      default: false
      selector:
        boolean:

tank_entry:
  fields:
    area:
      required: true
      selector:
        device:
          filter:
            integration: mannito
    kind:
      required: true
      default: top_up
      selector:
        select:
          translation_key: tank_kind
          options:
            - fresh
            - top_up
            - withdrawal
            - level_check
    liters:
      required: true
      selector:
        number:
          min: 0
          max: 10000
          step: 0.1
          unit_of_measurement: L
          mode: box
    note:
      selector:
        text:

tank_reading:
  fields:
    area:
      required: true
      selector:
        device:
          filter:
            integration: mannito
    ec:
      selector:
        number:
          min: 0
          max: 20
          step: 0.01
          unit_of_measurement: mS/cm
          mode: box
    ph:
      selector:
        number:
          min: 0
          max: 14
          step: 0.1
          mode: box
    temperature:
      selector:
        number:
          min: -5
          max: 60
          step: 0.1
          unit_of_measurement: °C
          mode: box
