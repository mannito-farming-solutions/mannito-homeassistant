[project]
name = "mannito-homeassistant"
version = "0.1.0"
description = "Home Assistant integration for Mannito grow controllers through the Mannito cloud"
requires-python = ">=3.13.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components.mannito"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "D"]
# E501: the formatter wraps code, long lines are texts; D401: properties describe what they return
ignore = ["D203", "D213", "D401", "E501", "PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004", "B017"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.mannito"]
force-sort-within-sections = true
combine-as-imports = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
explicit_package_bases = true
packages = ["custom_components.mannito"]

[[tool.mypy.overrides]]
# the platforms of Home Assistant re-export their entity classes and enums without __all__
module = ["homeassistant.*"]
implicit_reexport = true
